services:

  postgres:
    image: postgres:15-alpine
    container_name: smart_pg_postgres
    environment:
      POSTGRES_DB: smart_rooms_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Shivam@12345
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: smart_pg_redis
    environment:
      SPRING_DATA_REDIS_HOST: redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

  springboot-app:
    build: .
    container_name: smart_pg_app
    env_file:
      - src/main/resources/.env
    ports:
      - "8080:8080"
    depends_on:
      - postgres
      - redis

volumes:
  postgres-data:
    driver: local
  redis-data:
    driver: local














